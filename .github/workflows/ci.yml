name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install .

      - name: Run test suite
        # DIAGNOSTIC (temporary): on failure, surface the pytest failure
        # details as a check annotation, since step logs need sign-in to view.
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.log
          PYTEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$PYTEST_EXIT_CODE" -ne 0 ]; then
            python .github/workflows/annotate_pytest_failures.py pytest-output.log
          fi
          exit "$PYTEST_EXIT_CODE"

      - name: Run connector self-test harness
        # Static contract checks only: no live targets, no real secrets, no drivers required.
        run: python -m connectors.harness
